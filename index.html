<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="hub-container">
        <header class="hub-header">
            <h1>🎮 Game Hub</h1>
            <p class="hub-subtitle">혼자서 즐기는 온라인 게임 컬렉션</p>
            <button id="theme-toggle-btn" aria-label="Toggle dark mode">
                <span class="theme-icon light-icon">🌙</span>
                <span class="theme-icon dark-icon">☀️</span>
            </button>
        </header>

        <div class="games-grid">
            <a href="games/2048/index.html" class="game-card">
                <div class="game-card-icon">🔢</div>
                <div class="game-card-content">
                    <h2>2048</h2>
                    <p>숫자 타일을 합쳐서 2048을 만들어보세요!</p>
                </div>
                <div class="game-card-arrow">→</div>
            </a>

            <a href="games/snake/index.html" class="game-card">
                <div class="game-card-icon">🐍</div>
                <div class="game-card-content">
                    <h2>Snake</h2>
                    <p>뱀을 조종해 먹이를 먹고 길게 자라보세요!</p>
                </div>
                <div class="game-card-arrow">→</div>
            </a>

            <a href="games/minesweeper/index.html" class="game-card">
                <div class="game-card-icon">💣</div>
                <div class="game-card-content">
                    <h2>Minesweeper</h2>
                    <p>지뢰를 피해 모든 칸을 열어보세요!</p>
                </div>
                <div class="game-card-arrow">→</div>
            </a>

            <a href="games/tetris/index.html" class="game-card">
                <div class="game-card-icon">🧱</div>
                <div class="game-card-content">
                    <h2>Tetris</h2>
                    <p>떨어지는 블록을 쌓아 줄을 완성하세요!</p>
                </div>
                <div class="game-card-arrow">→</div>
            </a>
        </div>

        <footer class="hub-footer">
            <p>키보드 또는 터치로 조작하세요</p>
        </footer>
    </div>

    <script src="hub.js"></script>
</body>
</html>
