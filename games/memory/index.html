<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Game</title>
    <link rel="stylesheet" href="../../common.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="animated-bg">
    <div class="container fade-in">
        <header>
            <div class="header-left">
                <a href="../../index.html" class="back-btn back-btn-enhanced" aria-label="Back to Game Hub">← Hub</a>
                <h1>🧠 Memory</h1>
            </div>
            <div class="score-container">
                <div class="score-box">
                    <div class="score-label">MOVES</div>
                    <div id="moves">0</div>
                </div>
                <div class="score-box">
                    <div class="score-label">BEST</div>
                    <div id="best-score">-</div>
                </div>
            </div>
        </header>

        <div class="game-info">
            <p>같은 그림의 카드 짝을 찾아보세요!</p>
            <div class="game-buttons">
                <button id="new-game-btn">New Game</button>
                <select id="difficulty-select">
                    <option value="easy">Easy (4x3)</option>
                    <option value="medium" selected>Medium (4x4)</option>
                    <option value="hard">Hard (6x4)</option>
                </select>
                <button id="sound-toggle-btn" aria-label="Toggle sound">
                    <span class="sound-on-icon">🔊</span>
                    <span class="sound-off-icon">🔇</span>
                </button>
                <button id="theme-toggle-btn" aria-label="Toggle dark mode">
                    <span class="theme-icon light-icon">🌙</span>
                    <span class="theme-icon dark-icon">☀️</span>
                </button>
            </div>
        </div>

        <div id="game-container">
            <div id="game-board"></div>
            <div id="game-message" class="hidden">
                <p></p>
                <button id="retry-btn">Play Again</button>
            </div>
        </div>

        <div class="stats-info">
            <div class="stat-item">
                <span class="stat-label">Pairs Found:</span>
                <span id="pairs-found">0</span> / <span id="total-pairs">8</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Time:</span>
                <span id="timer">0:00</span>
            </div>
        </div>

        <div class="instructions">
            <p><strong>조작 방법:</strong> 카드를 클릭하여 뒤집으세요.</p>
            <p>두 카드가 같으면 짝이 맞춰지고, 다르면 다시 뒤집힙니다.</p>
        </div>
    </div>

    <script src="../../common.js"></script>
    <script src="game.js"></script>
</body>
</html>
