<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breakout Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-left">
                <a href="../../index.html" class="back-btn" aria-label="Back to Game Hub">← Hub</a>
                <h1>🧱 Breakout</h1>
            </div>
            <div class="score-container">
                <div class="score-box">
                    <div class="score-label">SCORE</div>
                    <div id="score">0</div>
                </div>
                <div class="score-box">
                    <div class="score-label">BEST</div>
                    <div id="best-score">0</div>
                </div>
            </div>
        </header>

        <div class="game-info">
            <div class="level-info">
                <span>Level: <strong id="level">1</strong></span>
                <span>Lives: <strong id="lives">3</strong></span>
            </div>
            <div class="game-buttons">
                <button id="new-game-btn">New Game</button>
                <button id="pause-btn" aria-label="Pause game">⏸️</button>
                <button id="sound-toggle-btn" aria-label="Toggle sound">
                    <span class="sound-on-icon">🔊</span>
                    <span class="sound-off-icon">🔇</span>
                </button>
                <button id="theme-toggle-btn" aria-label="Toggle dark mode">
                    <span class="theme-icon light-icon">🌙</span>
                    <span class="theme-icon dark-icon">☀️</span>
                </button>
            </div>
        </div>

        <div class="game-area">
            <div id="game-container">
                <canvas id="game-canvas"></canvas>
                <div id="game-message" class="hidden">
                    <p></p>
                    <button id="retry-btn">Try again</button>
                </div>
                <div id="start-message">
                    <p>Press Space or Tap to Start</p>
                </div>
            </div>
        </div>

        <div class="instructions">
            <p><strong>조작 방법:</strong> ← → 또는 마우스로 패들 이동 | Space 공 발사</p>
        </div>

        <div class="mobile-controls">
            <div class="control-row">
                <button class="control-btn" data-action="left">←</button>
                <button class="control-btn launch-btn" data-action="launch">🚀</button>
                <button class="control-btn" data-action="right">→</button>
            </div>
        </div>
    </div>

    <script src="../../common.js"></script>
    <script src="game.js"></script>
</body>
</html>
