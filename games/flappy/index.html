<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird</title>
    <link rel="stylesheet" href="../../common.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="animated-bg">
    <div class="container fade-in">
        <header>
            <div class="header-left">
                <a href="../../index.html" class="back-btn back-btn-enhanced" aria-label="Back to Game Hub">← Hub</a>
                <h1>🐤 Flappy Bird</h1>
            </div>
            <div class="score-container">
                <div class="score-box">
                    <div class="score-label">SCORE</div>
                    <div id="score">0</div>
                </div>
                <div class="score-box">
                    <div class="score-label">BEST</div>
                    <div id="best-score">0</div>
                </div>
            </div>
        </header>

        <div class="game-info">
            <p>파이프 사이를 통과하세요!</p>
            <div class="game-buttons">
                <button id="start-btn">Start Game</button>
                <button id="sound-toggle-btn" aria-label="Toggle sound">
                    <span class="sound-on-icon">🔊</span>
                    <span class="sound-off-icon">🔇</span>
                </button>
                <button id="theme-toggle-btn" aria-label="Toggle dark mode">
                    <span class="theme-icon light-icon">🌙</span>
                    <span class="theme-icon dark-icon">☀️</span>
                </button>
            </div>
        </div>

        <div id="game-container">
            <canvas id="game-canvas" width="400" height="600"></canvas>
            <div id="game-overlay" class="game-overlay">
                <div class="overlay-content">
                    <p id="overlay-text">Click or Press Space to Start</p>
                    <button id="play-btn" class="play-btn">▶ Play</button>
                </div>
            </div>
        </div>

        <div class="instructions">
            <p><strong>조작 방법:</strong> 클릭, 탭, 또는 스페이스바를 눌러 새를 위로 날리세요.</p>
            <p>파이프 사이를 통과할 때마다 점수가 올라갑니다!</p>
        </div>
    </div>

    <script src="../../common.js"></script>
    <script src="game.js"></script>
</body>
</html>
