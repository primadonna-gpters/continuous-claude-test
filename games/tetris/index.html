<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-left">
                <a href="../../index.html" class="back-btn" aria-label="Back to Game Hub">← Hub</a>
                <h1>🧱 Tetris</h1>
            </div>
            <div class="score-container">
                <div class="score-box">
                    <div class="score-label">SCORE</div>
                    <div id="score">0</div>
                </div>
                <div class="score-box">
                    <div class="score-label">BEST</div>
                    <div id="best-score">0</div>
                </div>
            </div>
        </header>

        <div class="game-info">
            <div class="level-info">
                <span>Level: <strong id="level">1</strong></span>
                <span>Lines: <strong id="lines">0</strong></span>
            </div>
            <div class="game-buttons">
                <button id="new-game-btn">New Game</button>
                <button id="pause-btn" aria-label="Pause game">⏸️</button>
                <button id="sound-toggle-btn" aria-label="Toggle sound">
                    <span class="sound-on-icon">🔊</span>
                    <span class="sound-off-icon">🔇</span>
                </button>
                <button id="theme-toggle-btn" aria-label="Toggle dark mode">
                    <span class="theme-icon light-icon">🌙</span>
                    <span class="theme-icon dark-icon">☀️</span>
                </button>
            </div>
        </div>

        <div class="game-area">
            <div id="game-container">
                <canvas id="game-canvas"></canvas>
                <div id="game-message" class="hidden">
                    <p></p>
                    <button id="retry-btn">Try again</button>
                </div>
                <div id="start-message">
                    <p>Press Space or Tap to Start</p>
                </div>
            </div>
            <div class="side-panel">
                <div class="next-piece-box">
                    <div class="panel-label">NEXT</div>
                    <canvas id="next-canvas"></canvas>
                </div>
                <div class="hold-piece-box">
                    <div class="panel-label">HOLD</div>
                    <canvas id="hold-canvas"></canvas>
                </div>
            </div>
        </div>

        <div class="instructions">
            <p><strong>조작 방법:</strong> ← → 이동 | ↓ 빠르게 | ↑ 또는 X 회전 | Z 역회전</p>
            <p><strong>Space</strong>: 하드 드롭 | <strong>C</strong>: 홀드 | <strong>P</strong>: 일시정지</p>
        </div>

        <div class="mobile-controls">
            <div class="control-row-top">
                <button class="control-btn rotate-btn" data-action="rotateLeft">↺</button>
                <button class="control-btn" data-action="hardDrop">⬇⬇</button>
                <button class="control-btn rotate-btn" data-action="rotateRight">↻</button>
            </div>
            <div class="control-row">
                <button class="control-btn" data-action="left">←</button>
                <button class="control-btn" data-action="softDrop">↓</button>
                <button class="control-btn" data-action="right">→</button>
            </div>
            <div class="control-row-bottom">
                <button class="control-btn hold-btn" data-action="hold">HOLD</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
