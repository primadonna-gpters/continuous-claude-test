<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordle</title>
    <link rel="stylesheet" href="../../common.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="animated-bg">
    <div class="container fade-in">
        <header>
            <div class="header-left">
                <a href="../../index.html" class="back-btn back-btn-enhanced" aria-label="Back to Game Hub">← Hub</a>
                <h1>📝 Wordle</h1>
            </div>
            <div class="score-container">
                <div class="score-box">
                    <div class="score-label">WINS</div>
                    <div id="wins">0</div>
                </div>
                <div class="score-box">
                    <div class="score-label">STREAK</div>
                    <div id="streak">0</div>
                </div>
            </div>
        </header>

        <div class="game-info">
            <p>5글자 영어 단어를 6번 안에 맞춰보세요!</p>
            <div class="game-buttons">
                <button id="new-game-btn">New Word</button>
                <button id="theme-toggle-btn" aria-label="Toggle dark mode">
                    <span class="theme-icon light-icon">🌙</span>
                    <span class="theme-icon dark-icon">☀️</span>
                </button>
            </div>
        </div>

        <div id="game-container">
            <div id="board">
                <!-- 6 rows x 5 columns of tiles generated by JS -->
            </div>

            <div id="game-message" class="hidden">
                <p id="message-text"></p>
                <p id="answer-text"></p>
                <button id="play-again-btn">Play Again</button>
            </div>
        </div>

        <div id="keyboard">
            <div class="keyboard-row">
                <button class="key" data-key="Q">Q</button>
                <button class="key" data-key="W">W</button>
                <button class="key" data-key="E">E</button>
                <button class="key" data-key="R">R</button>
                <button class="key" data-key="T">T</button>
                <button class="key" data-key="Y">Y</button>
                <button class="key" data-key="U">U</button>
                <button class="key" data-key="I">I</button>
                <button class="key" data-key="O">O</button>
                <button class="key" data-key="P">P</button>
            </div>
            <div class="keyboard-row">
                <button class="key" data-key="A">A</button>
                <button class="key" data-key="S">S</button>
                <button class="key" data-key="D">D</button>
                <button class="key" data-key="F">F</button>
                <button class="key" data-key="G">G</button>
                <button class="key" data-key="H">H</button>
                <button class="key" data-key="J">J</button>
                <button class="key" data-key="K">K</button>
                <button class="key" data-key="L">L</button>
            </div>
            <div class="keyboard-row">
                <button class="key key-wide" data-key="ENTER">ENTER</button>
                <button class="key" data-key="Z">Z</button>
                <button class="key" data-key="X">X</button>
                <button class="key" data-key="C">C</button>
                <button class="key" data-key="V">V</button>
                <button class="key" data-key="B">B</button>
                <button class="key" data-key="N">N</button>
                <button class="key" data-key="M">M</button>
                <button class="key key-wide" data-key="BACKSPACE">⌫</button>
            </div>
        </div>

        <div class="instructions">
            <p><strong>조작 방법:</strong> 키보드로 5글자 영어 단어를 입력하세요.</p>
            <p>🟩 정확한 위치 | 🟨 다른 위치에 있음 | ⬜ 없는 글자</p>
        </div>
    </div>

    <script src="../../common.js"></script>
    <script src="game.js"></script>
</body>
</html>
